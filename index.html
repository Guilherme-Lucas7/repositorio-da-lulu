<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repositório da Lulu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3A1D72">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lulu">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: caderno de uma coluna para celular. Capa roxa no topo (cor de tinta de mimeógrafo),
   páginas lilás-claro, doca flutuante embaixo e um botão de ação que muda conforme a tela. */
:root{
  --paper:#F5F2FA; --surface:#FFFFFF; --ink:#24163F; --muted:#6B6280; --line:#E2DBEE;
  --cover:#3A1D72; --cover-ink:#F3EDFF; --cover-muted:#C7B6EC;
  --accent:#6D3BE0; --accent-ink:#FFFFFF; --accent-text:#5A2BC7; --accent-soft:#ECE4FC;
  --giz:#E4F06A; --giz-ink:#2C2A05;
  --red:#B8364F; --red-soft:#FBE8EC; --green:#22795A; --green-soft:#E1F3EA; --amber:#9A5B0C; --amber-soft:#FBEFD9;
  --n-lilas:#EDE5FD; --n-menta:#DDF3E8; --n-giz:#F4F7C9; --n-rosa:#FCE3EE; --n-ceu:#DEECFB;
  --shadow:0 10px 28px rgba(36,22,63,.16);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15101F; --surface:#1E1730; --ink:#EEE8FA; --muted:#A79DBF; --line:#342A4B;
  --cover:#28134F; --cover-ink:#F3EDFF; --cover-muted:#B39FE0;
  --accent:#A88BFF; --accent-ink:#1A0E36; --accent-text:#C3AEFF; --accent-soft:#2E2350;
  --giz:#D6E35C; --giz-ink:#1F1E04;
  --red:#FF8A9E; --red-soft:#3B1A24; --green:#6FD3A6; --green-soft:#143027; --amber:#F2B45A; --amber-soft:#3A2A12;
  --n-lilas:#2D2346; --n-menta:#1B3229; --n-giz:#30321A; --n-rosa:#3A2230; --n-ceu:#1C2B3E;
  --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15101F; --surface:#1E1730; --ink:#EEE8FA; --muted:#A79DBF; --line:#342A4B;
  --cover:#28134F; --cover-ink:#F3EDFF; --cover-muted:#B39FE0;
  --accent:#A88BFF; --accent-ink:#1A0E36; --accent-text:#C3AEFF; --accent-soft:#2E2350;
  --giz:#D6E35C; --giz-ink:#1F1E04;
  --red:#FF8A9E; --red-soft:#3B1A24; --green:#6FD3A6; --green-soft:#143027; --amber:#F2B45A; --amber-soft:#3A2A12;
  --n-lilas:#2D2346; --n-menta:#1B3229; --n-giz:#30321A; --n-rosa:#3A2230; --n-ceu:#1C2B3E;
  --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cover)}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15;letter-spacing:-.01em}
h2{font-size:20px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
p{margin:0}

/* capa (cabeçalho) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cover);color:var(--cover-ink)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-size:19px;line-height:1.1;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit}
.brand svg{flex:none}
.sync{margin-left:auto;font-size:13px;color:var(--cover-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--cover-muted);display:inline-block}
.sync.on i{background:var(--giz)}
.sync.off i{background:#ff8a9e}

main{max-width:720px;margin:0 auto;padding-block:18px 150px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h .link{font-size:14px}

/* capa da página inicial */
.hero{background:var(--cover);color:var(--cover-ink);border-radius:24px;padding:22px 20px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:repeating-radial-gradient(circle at center, transparent 0 9px, rgba(255,255,255,.06) 9px 10px);pointer-events:none}
.hero h1{font-size:32px}
.hero .when{color:var(--cover-muted);font-size:15px}
.meter{display:grid;gap:6px}
.meter-bar{height:10px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden}
.meter-bar span{display:block;height:100%;background:var(--giz);border-radius:6px}
.meter-l{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--cover-muted)}
.meter-l b{color:var(--cover-ink);font-weight:700;white-space:nowrap}
.meter-l span{text-align:right}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.quick button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:var(--cover-ink);border-radius:14px;padding:10px 6px;display:grid;justify-items:center;gap:4px;font-size:14px;line-height:1.2}
.quick button:hover{background:rgba(255,255,255,.18)}

/* botões e campos */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.full{width:100%;padding:14px;font-size:17px}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;color:var(--accent-text);font-weight:700;padding:4px 0;text-decoration:none}
.back{background:none;border:0;color:var(--muted);padding:0;font-size:15px;display:inline-flex;gap:6px;align-items:center}

.field{display:grid;gap:6px;min-width:0}
.field>label,.flabel{font-size:14px;font-weight:700;color:var(--muted)}
.field>label i{color:var(--red);font-style:normal}
.field input,.field textarea,.field select,.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.hint{font-size:13px;color:var(--muted)}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 16px;display:grid;gap:16px;min-width:0}
.sheet>h3{color:var(--accent-text)}
.err{background:var(--red-soft);color:var(--red);border-radius:12px;padding:10px 12px;font-weight:700}
.ok{background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 12px}
.demo{background:var(--n-giz);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.savebar{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}

/* etiqueta de turma */
.tt{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap;
  background:color-mix(in srgb,var(--c) 15%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.tt::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:13px;background:var(--accent-soft);color:var(--accent-text)}
.code{font-variant-numeric:tabular-nums;letter-spacing:.02em}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.st.dada{color:var(--green)}
.st.planejada{color:var(--amber)}

/* listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.li:first-child{border-top:0}
button.li:hover{background:var(--accent-soft)}
.li .main{min-width:0;display:grid;gap:2px}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datebox{width:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;justify-items:center;padding:5px 0;line-height:1.05}
.datebox b{font-family:var(--f-display);font-weight:400;font-size:20px}
.datebox span{font-size:11px;font-weight:700;text-transform:lowercase}
.datebox.feriado{background:var(--red-soft);color:var(--red)}
.datebox.recesso{background:var(--amber-soft);color:var(--amber)}
.datebox.aula{background:var(--green-soft);color:var(--green)}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:22px 16px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty b{color:var(--ink)}

/* cartões de aula */
.aula{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;width:100%;display:grid;gap:8px}
.aula:hover{border-color:var(--accent)}
.aula .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.aula .h .st{margin-left:auto}
.aula .ti{font-family:var(--f-display);font-size:19px;line-height:1.25}
.aula .ex{color:var(--muted);font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.aula .f{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.month-h{font-family:var(--f-display);font-size:16px;color:var(--muted);padding-top:6px}

/* leitura de aula */
.read{display:grid;gap:18px}
.read .block{display:grid;gap:6px}
.read .block h3{font-size:16px;color:var(--accent-text);font-family:var(--f-body);font-weight:700}
.read .block p{white-space:pre-wrap;max-width:68ch}
.file{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);text-align:left;width:100%;min-width:0}
.file span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--muted);flex:none}
.reflex{background:var(--n-giz);border-radius:16px;padding:14px 16px;display:grid;gap:6px}

/* notas */
.notes{columns:2 160px;column-gap:12px}
.note{break-inside:avoid;display:grid;gap:6px;width:100%;margin:0 0 12px;text-align:left;border:0;border-radius:4px 16px 16px 16px;padding:14px;background:var(--nc,var(--n-lilas));color:var(--ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent)}
.note .nt{font-family:var(--f-display);font-size:17px;line-height:1.25}
.note .nx{font-size:15px;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical}
.note .nm{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface) inset}

/* agenda */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 10px 14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 10px}
.cal-h h2{min-width:0}
.cal-nav{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1/1.08;max-width:100%;border:0;border-radius:12px;background:none;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;padding:4px 0 6px;position:relative;font-variant-numeric:tabular-nums;font-size:15px}
.day.out{color:var(--muted);opacity:.45}
.day.we{color:var(--muted)}
.day.feriado{background:var(--red-soft);color:var(--red)}
.day.recesso{background:repeating-linear-gradient(135deg,var(--amber-soft) 0 6px,transparent 6px 10px);color:var(--amber)}
.day.hoje span.n{background:var(--giz);color:var(--giz-ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:700}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.stamp{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}

/* avisos */
.aviso{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.aviso .tx{white-space:pre-wrap;font-size:15px;max-height:9.5em;overflow:hidden;position:relative}
.aviso details .tx{max-height:none}
.found{display:grid;gap:8px}
.fd{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;background:var(--accent-soft);border-radius:14px;padding:10px}
.fd-r{display:grid;gap:8px;min-width:0}
.fd-r .row{justify-content:space-between}
.fd input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:16px}
.src{font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

/* mais */
.menu .li .ic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}

/* doca e botão de ação */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:6px}
.dock button{background:none;border:0;border-radius:16px;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:700;padding:8px 0 6px}
.dock button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px 14px 16px;font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--red-soft);border-radius:12px;padding:10px 12px;color:var(--red);font-weight:700}

/* login */
.login{max-width:420px;margin:6vh auto 0;display:grid;gap:16px}
.login .seal{width:64px;height:64px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--accent-soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--accent-text)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}


/* questões */
:root{--qa:#6D3BE0;--qb:#B8327A;--qc:#1C7A52;--qd:#B05A08;--q-ink:#FFFFFF;--sheet:#FFFFFF;--sheet-ink:#1B1726;--sheet-line:#8E879C}
.qc{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.qc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qsel{border:0;background:none;padding:15px 4px 14px 14px;display:grid;align-content:start}
.qsel span{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.qsel span svg{width:15px;height:15px}
.qsel[aria-pressed="true"] span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qbody{border:0;background:none;text-align:left;padding:14px 16px 14px 10px;display:grid;gap:6px;min-width:0}
.qe{font-size:16px;font-weight:700;line-height:1.35;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.qr{font-size:14px;color:var(--green);display:flex;gap:4px;align-items:flex-start;min-width:0}
.qr svg{flex:none;width:15px;height:15px;margin-top:3px}
.qbody .f{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.alt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.alt input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.alt-l{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:grid;place-items:center;padding:0;color:var(--muted)}
.alt-l[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--paper)}
.selbar{position:fixed;z-index:22;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}

  const r={}; COLS[t].forEach(k=>{ let v=row[k]; if(v===undefined) return; if(v===""&&NULOS.includes(k)) v=null; r[k]=v; });
  return r;
}

function bimestresDo(ano){
  const p = D.perfil?.bimestres?.[ano]; if(Array.isArray(p)&&p.length===4&&p.every(x=>x[0]&&x[1])) return {lista:p,proprio:true};
  const o = CAL_OFICIAL[ano]; return o?{lista:o.bimestres,proprio:false}:null;
}
function bimestreDe(s){
  if(!s) return null; const b=bimestresDo(parseD(s).getFullYear()); if(!b) return null;
  const i=b.lista.findIndex(([a,z])=>s>=a&&s<=z); return i>=0?i+1:null;
}
function datasOficiais(s){
  const o=CAL_OFICIAL[parseD(s).getFullYear()]; if(!o) return [];
  return o.datas.filter(x=>x.f?(s>=x.d&&s<=x.f):s===x.d);
}

/* ---------- leitura de datas em avisos ---------- */
const MES_IDX = {janeiro:0,fevereiro:1,marco:2,abril:3,maio:4,junho:5,julho:6,agosto:7,setembro:8,outubro:9,novembro:10,dezembro:11,
  jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
const DIA_IDX = {domingo:0,segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6};
function lerDatas(texto, base){
  base = base || hoje();
  const linhas = String(texto||"").split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const achados = []; const vistos = new Set();
  const bd = parseD(base);
  const anoPara = (m,d) => { let y=bd.getFullYear(); const c=new Date(y,m,d,12); if((bd-c)/864e5>60) y++; return y; };
  const add = (dt, linha, trecho) => {
    if(!dt||isNaN(dt)) return; const s=ymd(dt); if(vistos.has(s)) return; vistos.add(s);
    const hora = lerHora(linha);
    const reTrecho = new RegExp("(?:(?:^|\\s)(?:no dia|dia|na|no|em|at[ée])\\s+)?"+trecho.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&"),"i");
    let titulo = linha.replace(reTrecho,"").replace(/(?:^|\s)(?:[àa]s|a partir d[ae]s?)\s*\d{1,2}(?:[:h]\d{2})?\s*(?:h(?:oras|rs)?)?(?=\s|$|[.,;!])/i,"")
      .replace(/\b(?:(?:na|no|nesta|neste|nessa|nesse|pr[óo]xima|pr[óo]ximo)\s+)?(?:segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado|domingo)(?:-feira)?\b/gi,"")
      .replace(/\s{2,}/g," ").trim();
    for(let i=0;i<4;i++) titulo = titulo.replace(/^[\s\-–—:,.*•📌📅🗓️⚠️❗️‼️🔔]+|[\s\-–—:,.*]+$/gu,"").replace(/\s+(?:at[ée]|em|no dia|dia|na|no|de|do|da|para|pra|a partir d[eoa]s?|[àa]s?)$/i,"").replace(/^(?:dia|em|na|no|tem|teremos|haver[áa]|vai ter)\s+/i,"").trim();
    for(let i=0;i<3;i++) titulo = titulo.replace(/^(?:bom dia|boa tarde|boa noite|ol[áa]|oi|pessoal|aten[çc][ãa]o|queridos?|prezad[oa]s?|professor(?:es|as)?)[\s,!.:]*/i,"").trim();
    titulo = titulo.charAt(0).toUpperCase()+titulo.slice(1);
    if(titulo.length<4) titulo = linhas[0].replace(/^[\s\-–—:,.*•]+/u,"").trim();
    achados.push({data:s, hora, titulo:titulo.slice(0,80)});
  };
  for(const linha of linhas){
    const L = norm(linha);
    let m;
    const reNum = /\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/g;
    while((m=reNum.exec(linha))){ const d=+m[1], mo=+m[2]-1; if(d<1||d>31||mo<0||mo>11) continue;
      const y = m[3] ? (m[3].length===2?2000+(+m[3]):+m[3]) : anoPara(mo,d); add(new Date(y,mo,d,12), linha, m[0]); }
    const reExt = /\b(\d{1,2})(?:º|°)?\s+de\s+(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)(?:\s+de\s+(\d{4}))?/g;
    while((m=reExt.exec(L))){ const d=+m[1], mo=MES_IDX[m[2]]; const y=m[3]?+m[3]:anoPara(mo,d);
      add(new Date(y,mo,d,12), linha, linha.substr(m.index, m[0].length)); }
    if(/\bamanha\b/.test(L)) add(parseD(addDays(base,1)), linha, /amanh[ãa]/i.exec(linha)[0]);
    else if(/\bhoje\b/.test(L) && !vistos.size) add(parseD(base), linha, /hoje/i.exec(linha)[0]);
    const reSem = /\b(?:(?:nesta|nessa|esta|essa|proxima|na proxima|no proximo|neste|nesse)\s+)?(domingo|segunda|terca|quarta|quinta|sexta|sabado)(?:-feira)?\b/;
    if((m=reSem.exec(L)) && !/\d{1,2}\/\d{1,2}/.test(linha) && !/\d{1,2}\s+de\s+[a-z]+/.test(L)){
      const alvo=DIA_IDX[m[1]]; let n=(alvo-bd.getDay()+7)%7; if(n===0) n=7;
      add(parseD(addDays(base,n)), linha, linha.substr(m.index, m[0].length));
    }
  }
  return achados.sort((a,b)=>a.data.localeCompare(b.data));
}
function lerHora(t){
  const s = norm(t);
  let m = /\b(\d{1,2}):(\d{2})\b/.exec(s) || /\b(\d{1,2})h(\d{2})?\b/.exec(s) || /\b(?:as|a partir das?)\s+(\d{1,2})(?:\s*horas?)?\b/.exec(s);
  if(!m) return ""; const h=+m[1], mi=m[2]?+m[2]:0; if(h>23||mi>59) return ""; return `${pad(h)}:${pad(mi)}`;
}

TELAS.inicio = () => {
  const h=hoje(), d=parseD(h), hora=new Date().getHours();
  const saud = hora<12?"Bom dia":hora<18?"Boa tarde":"Boa noite";
  const nome = D.perfil?.nome || (demo ? "Lulu" : "professora");
  const of = CAL_OFICIAL[d.getFullYear()];
  let meter="";
  if(of){
    const tot=diasEntre(of.inicio,of.fim), feito=Math.min(tot,Math.max(0,diasEntre(of.inicio,h))), falta=diasEntre(h,of.fim);
    const b=bimestreDe(h), hojeOf=datasOficiais(h).find(x=>x.k==="recesso");
    const rot = h<of.inicio ? `O ano letivo começa em ${fmtCurta(of.inicio)}` : h>of.fim ? "Ano letivo encerrado" : hojeOf ? "Recesso" : b ? `${b}º bimestre` : "Entre bimestres";
    meter = `<div class="meter"><div class="meter-l"><b>${rot}</b><span>${falta>0&&h<=of.fim?`faltam ${falta} dias para ${fmtCurta(of.fim)}`:""}</span></div>
      <div class="meter-bar" role="img" aria-label="Ano letivo ${Math.round(feito/tot*100)}% concluído"><span style="width:${feito/tot*100}%"></span></div></div>`;
  }
  const aulasHoje = aulasDoDia(h), aulasAmanha = aulasDoDia(addDays(h,1));
  const prox=[]; for(let i=0;i<=14;i++){ const s=addDays(h,i);
    datasOficiais(s).forEach(x=>{ if(!x.f||s===x.d||i===0) prox.push({s,t:x.t,k:x.k}); });
    eventosDoDia(s).forEach(e=>{ if(e.data===s||i===0) prox.push({s,t:e.titulo,e}); }); }
  const fix = D.anotacoes.filter(n=>n.fixada).slice(0,4);
  return `<div class="stack">
  ${demo?`<div class="demo"><b>Modo demonstração</b>Os dados ficam só neste aparelho e os itens marcados como exemplo podem ser apagados. Para guardar na nuvem, preencha o config.js com os dados do Supabase.</div>`:""}
  <section class="hero">
    <div><h1>${saud}, ${esc(nome)}</h1><p class="when">${fmtLonga(h)}</p></div>
    ${meter}
    <div class="quick">
      <button data-act="nova-aula">${ICON.aula}Aula</button>
      <button data-act="nova-nota">${ICON.nota}Nota</button>
      <button data-act="novo-lembrete">${ICON.sino}Lembrete</button>
      <button data-act="go" data-v="avisos">${ICON.aviso}Aviso</button>
      <button data-act="go" data-v="questoes"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9.5 9.3a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.9-1.1 1.6v.4"/><path d="M12 17.2v.1"/></svg>Quiz</button>
    </div>
  </section>
  ${!demo && !D.perfil?.nome?`<div class="demo"><b>Como você quer ser chamada?</b>Coloque seu nome e o nome da escola para aparecerem aqui e no cabeçalho das provas.<button class="btn sm" data-act="go" data-v="calendario" style="justify-self:start;margin-top:6px">Preencher perfil</button></div>`:""}
  ${!D.turmas.length?`<div class="empty"><b>Comece cadastrando suas turmas</b>Com as turmas criadas, cada aula fica guardada no lugar certo e a busca por turma e ano funciona.<button class="btn pri" data-act="nova-turma">Cadastrar turma</button></div>`:""}
  <section class="sec"><div class="sec-h"><h2>Aulas de hoje</h2><button class="link" data-act="go" data-v="aulas">Ver todas</button></div>
    ${aulasHoje.length?`<div class="list">${aulasHoje.map(liAula).join("")}</div>`:`<p class="muted small">Nenhuma aula com a data de hoje.${aulasAmanha.length?"":" Toque em Nova aula para planejar."}</p>`}
    ${aulasAmanha.length?`<h3 class="muted" style="margin-top:6px">Amanhã</h3><div class="list">${aulasAmanha.map(liAula).join("")}</div>`:""}
  </section>
  <section class="sec"><div class="sec-h"><h2>Próximas duas semanas</h2><button class="link" data-act="go" data-v="agenda">Agenda</button></div>
    ${prox.length?`<div class="list">${prox.slice(0,7).map(x=>liData(x)).join("")}</div>`:`<p class="muted small">Nada marcado nas próximas duas semanas.</p>`}
  </section>
  ${fix.length?`<section class="sec"><div class="sec-h"><h2>Notas fixadas</h2><button class="link" data-act="go" data-v="notas">Todas as notas</button></div><div class="notes">${fix.map(cardNota).join("")}</div></section>`:""}
  </div>`;
};
function datebox(s,cls=""){ const d=parseD(s); return `<span class="datebox ${cls}"><b>${d.getDate()}</b><span>${MESES[d.getMonth()].slice(0,3)}</span></span>`; }
function liAula(a){
  return `<button class="li" data-act="abrir-aula" data-id="${esc(a.id)}">${datebox(a.data||hoje(),"aula")}
    <span class="main"><span class="t">${esc(a.titulo)}</span><span class="s">${[turmaDe(a.turma_id)?.nome, a.disciplina].filter(Boolean).map(esc).join(", ")}</span></span>
    <span class="st ${a.status}">${a.status==="dada"?"Dada":"Planejada"}</span></button>`;
}
function liData(x){
  if(x.e){ const t=TIPO[x.e.tipo]||TIPO.escola;
    return `<button class="li" data-act="editar-evento" data-id="${esc(x.e.id)}">${datebox(x.s)}<span class="main"><span class="t">${x.e.alarme_min!=null?`<span class="bell" aria-label="Com aviso">${ICON.sino}</span>`:""}${esc(x.t)}</span><span class="s">${esc([fmtLonga(x.s), x.e.hora].filter(Boolean).join(", "))}</span></span><span class="stamp" style="color:${t.c}">${t.n}</span></button>`; }
  const k=KIND[x.k];
  return `<div class="li">${datebox(x.s, x.k==="feriado"?"feriado":x.k==="recesso"?"recesso":"")}<span class="main"><span class="t">${esc(x.t)}</span><span class="s">${fmtLonga(x.s)}</span></span><span class="stamp" style="color:${k.c}">${k.n}</span></div>`;
}

/* ---- aulas ---- */
function aulasFiltradas(){
  const q = norm(filtro.q).trim();
  return D.aulas.filter(a=>{
    const t = turmaDe(a.turma_id);
    if(filtro.turma!=="todas" && a.turma_id!==filtro.turma) return false;
    if(filtro.ano!=="todos" && String(t?.ano_letivo ?? (a.data||"").slice(0,4))!==filtro.ano) return false;
    if(filtro.bim!=="todos" && String(a.bimestre||bimestreDe(a.data)||"")!==filtro.bim) return false;
    if(filtro.status!=="todas" && a.status!==filtro.status) return false;
    if(!q) return true;
    const alvo = norm([a.titulo,a.disciplina,a.objetivos,a.conteudo,a.recursos,a.avaliacao,a.reflexao,t?.nome,t?.serie,...lista(a.bncc),...lista(a.etiquetas)].join(" "));
    return q.split(/\s+/).every(p=>alvo.includes(p));
  }).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
}
function cardAula(a){
  const bim = a.bimestre||bimestreDe(a.data);
  const extra = (a.conteudo||a.objetivos||"").trim();
  return `<button class="aula" data-act="abrir-aula" data-id="${esc(a.id)}">
    <span class="h">${ttag(a.turma_id)}<span>${a.data?fmtNum(a.data):"Sem data"}${bim?`, ${bim}º bim.`:""}</span><span class="st ${a.status}">${a.status==="dada"?"Dada":"Planejada"}</span></span>
    <span class="ti">${esc(a.titulo)}</span>
    ${extra?`<span class="ex">${esc(extra)}</span>`:""}
    ${(lista(a.bncc).length||lista(a.etiquetas).length||(a.anexos||[]).length)?`<span class="f">${lista(a.bncc).map(c=>`<span class="tag code">${esc(c)}</span>`).join("")}${lista(a.etiquetas).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}${(a.anexos||[]).length?`<span class="src">${ICON.clip}${a.anexos.length}</span>`:""}</span>`:""}
  </button>`;
}
TELAS.aulas = () => {
  const lst = aulasFiltradas();
  const anos = [...new Set([...D.turmas.map(t=>String(t.ano_letivo)), ...D.aulas.map(a=>(a.data||"").slice(0,4)).filter(Boolean)])].sort().reverse();
  const chip=(grp,v,n,cor)=>`<button class="chip" data-act="filtro" data-g="${grp}" data-v="${esc(v)}" aria-pressed="${filtro[grp]===v}">${cor?`<span class="dot" style="--c:${esc(cor)}"></span>`:""}${esc(n)}</button>`;
  let grupos="", mesAtual="";
  lst.forEach(a=>{ const m=a.data?`${MESES[parseD(a.data).getMonth()]} de ${a.data.slice(0,4)}`:"Sem data";
    if(m!==mesAtual){ grupos+=`<h3 class="month-h">${m.charAt(0).toUpperCase()+m.slice(1)}</h3>`; mesAtual=m; } grupos+=cardAula(a); });
  return `<div class="stack">
  <h1>Minhas aulas</h1>
  <input class="search" id="q" type="search" placeholder="Buscar por tema, conteúdo, BNCC, etiqueta…" value="${esc(filtro.q)}" aria-label="Buscar aulas">
  <div class="chips" aria-label="Turma">${chip("turma","todas","Todas as turmas")}${D.turmas.slice().sort((a,b)=>b.ano_letivo-a.ano_letivo||a.nome.localeCompare(b.nome,"pt-BR",{numeric:true})).map(t=>chip("turma",t.id,t.nome+(t.ano_letivo!==new Date().getFullYear()?` (${t.ano_letivo})`:""),t.cor)).join("")}</div>
  <div class="chips" aria-label="Ano e bimestre">${chip("ano","todos","Todos os anos")}${anos.map(y=>chip("ano",y,y)).join("")}<span style="width:6px;flex:none"></span>${chip("bim","todos","Todos os bimestres")}${[1,2,3,4].map(b=>chip("bim",String(b),b+"º bim.")).join("")}</div>
  <div class="chips">${chip("status","todas","Planejadas e dadas")}${chip("status","planejada","Planejadas")}${chip("status","dada","Já dadas")}</div>
  <p class="muted small">${lst.length} ${lst.length===1?"aula":"aulas"}</p>
  ${lst.length?`<div class="stack" style="gap:10px">${grupos}</div>`:D.aulas.length?`<div class="empty"><b>Nenhuma aula com esses filtros</b><button class="btn soft sm" data-act="limpar-filtros">Limpar filtros</button></div>`:`<div class="empty"><b>Seu repositório está vazio</b>Guarde a primeira aula com objetivos, desenvolvimento e arquivos.<button class="btn pri" data-act="nova-aula">Nova aula</button></div>`}
  </div>`;
};
TELAS.aula = () => {
  const a = D.aulas.find(x=>x.id===sel); if(!a) return `<div class="empty">Aula não encontrada.<button class="btn" data-act="go" data-v="aulas">Voltar</button></div>`;
  const t=turmaDe(a.turma_id), bim=a.bimestre||bimestreDe(a.data);
  const bloco=(tit,txt)=>txt&&String(txt).trim()?`<div class="block"><h3>${tit}</h3><p>${esc(txt)}</p></div>`:"";
  return `<article class="read">
    <div class="stack" style="gap:10px"><button class="back" data-act="voltar">${ICON.left}Voltar</button>
    <div class="row">${ttag(a.turma_id)}<span class="muted small">${[t?.turno, a.disciplina].filter(Boolean).map(esc).join(", ")}</span></div>
    <h1>${esc(a.titulo)}</h1>
    <p class="muted">${a.data?fmtLonga(a.data)+" de "+a.data.slice(0,4):"Sem data"}${bim?`, ${bim}º bimestre`:""} <span class="st ${a.status}" style="margin-left:6px">${a.status==="dada"?"Dada":"Planejada"}</span></p>
    <div class="row"><button class="btn pri sm" data-act="editar-aula" data-id="${esc(a.id)}">Editar</button><button class="btn sm" data-act="duplicar" data-id="${esc(a.id)}">Usar em outra turma</button>${a.status==="planejada"?`<button class="btn soft sm" data-act="marcar-dada" data-id="${esc(a.id)}">Marcar como dada</button>`:""}</div></div>
    ${a.status==="dada"?(a.reflexao?`<div class="reflex"><h3>Como foi a aula</h3><p style="white-space:pre-wrap">${esc(a.reflexao)}</p></div>`:`<div class="reflex"><h3>Como foi a aula?</h3><p class="small">Anote o que funcionou e o que mudar. Ajuda muito quando for dar essa aula de novo.</p><button class="btn sm" data-act="editar-aula" data-id="${esc(a.id)}" style="justify-self:start">Escrever reflexão</button></div>`):""}
    ${bloco("Objetivos",a.objetivos)}${bloco("Desenvolvimento",a.conteudo)}${bloco("Recursos e materiais",a.recursos)}${bloco("Avaliação",a.avaliacao)}
    ${lista(a.bncc).length||lista(a.etiquetas).length?`<div class="block"><h3>BNCC e etiquetas</h3><div class="row">${lista(a.bncc).map(c=>`<span class="tag code">${esc(c)}</span>`).join("")}${lista(a.etiquetas).map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div></div>`:""}
    ${lista(a.links).length?`<div class="block"><h3>Links</h3>${lista(a.links).map(l=>`<a class="file" href="${esc(/^https?:\/\//i.test(l)?l:"https://"+l)}" target="_blank" rel="noopener"><span>${esc(l)}</span></a>`).join("")}</div>`:""}
    ${(a.anexos||[]).length?`<div class="block"><h3>Arquivos</h3>${a.anexos.map((x,i)=>`<button class="file" data-act="abrir-anexo" data-id="${esc(a.id)}" data-i="${i}">${ICON.clip}<span>${esc(x.nome)}</span><small>${tamanho(x.tam||0)}</small></button>`).join("")}</div>`:""}
    ${outrasVezes(a)}
  </article>`;
};
function outrasVezes(a){
  const k=norm(a.titulo).replace(/\(exemplo\)/,"").trim(); if(k.length<4) return "";
  const outras=D.aulas.filter(x=>x.id!==a.id&&norm(x.titulo).replace(/\(exemplo\)/,"").trim()===k);
  if(!outras.length) return "";
  return `<div class="block"><h3>Essa aula em outras turmas</h3><div class="list">${outras.map(liAula).join("")}</div></div>`;
}
TELAS["aula-form"] = () => {
  const a=draft, ed=!!sel, ts=turmasAtivas();
  const atual = a.turma_id && !ts.find(t=>t.id===a.turma_id) ? [turmaDe(a.turma_id)].filter(Boolean) : [];
  const bimAuto = bimestreDe(a.data);
  const bimV = a._bimManual ? a.bimestre : bimAuto;
  const discs=[...new Set([...D.turmas.map(t=>t.disciplina),...D.aulas.map(x=>x.disciplina)].filter(Boolean))];
  return `<form class="stack" id="form" data-k="aula" novalidate>
  <div class="stack" style="gap:8px"><button type="button" class="back" data-act="voltar">${ICON.left}Voltar</button><h1>${ed?"Editar aula":"Nova aula"}</h1></div>
  <div class="sheet">
    <div class="field"><label for="f-titulo">Tema da aula <i>*</i></label><input id="f-titulo" data-b="titulo" value="${esc(a.titulo)}" placeholder="Ex.: Frações equivalentes" required></div>
    <div class="two">
      <div class="field"><label for="f-turma">Turma</label><select id="f-turma" data-b="turma_id"><option value="">Sem turma</option>${[...ts,...atual].map(t=>`<option value="${esc(t.id)}" ${a.turma_id===t.id?"selected":""}>${esc(t.nome)} (${t.ano_letivo})</option>`).join("")}</select>
        <button type="button" class="link small" data-act="nova-turma" style="justify-self:start">Cadastrar turma</button></div>
      <div class="field"><label for="f-data">Data</label><input id="f-data" type="date" data-b="data" value="${esc(a.data||"")}"></div>
    </div>
    <div class="field"><span class="flabel">Bimestre</span><div class="chips wrap">${[1,2,3,4].map(b=>`<button type="button" class="chip" data-act="bim" data-v="${b}" aria-pressed="${bimV===b}">${b}º bimestre</button>`).join("")}</div>
      <span class="hint">${a._bimManual?"Escolhido manualmente.":bimAuto?"Preenchido pela data.":"Escolha o bimestre."}</span></div>
    <div class="field"><label for="f-disc">Disciplina</label><input id="f-disc" data-b="disciplina" list="dl-disc" value="${esc(a.disciplina||"")}"></div>
    <datalist id="dl-disc">${discs.map(d=>`<option value="${esc(d)}">`).join("")}</datalist>
  </div>
  <div class="sheet"><h3>Planejamento</h3>
    <div class="field"><label for="f-obj">Objetivos</label><textarea id="f-obj" data-b="objetivos" placeholder="O que a turma deve aprender">${esc(a.objetivos)}</textarea></div>
    <div class="field"><label for="f-cont">Desenvolvimento</label><textarea id="f-cont" data-b="conteudo" style="min-height:150px" placeholder="Passo a passo da aula">${esc(a.conteudo)}</textarea></div>
    <div class="field"><label for="f-rec">Recursos e materiais</label><textarea id="f-rec" data-b="recursos" style="min-height:70px">${esc(a.recursos)}</textarea></div>
    <div class="field"><label for="f-av">Avaliação</label><textarea id="f-av" data-b="avaliacao" style="min-height:70px">${esc(a.avaliacao)}</textarea></div>
    <div class="two">
      <div class="field"><label for="f-bncc">Habilidades da BNCC</label><input id="f-bncc" data-b="bncc" data-lista="1" value="${esc(lista(a.bncc).join(", "))}" placeholder="EF06MA07, EF06MA08" autocapitalize="characters"></div>
      <div class="field"><label for="f-etq">Etiquetas</label><input id="f-etq" data-b="etiquetas" data-lista="1" value="${esc(lista(a.etiquetas).join(", "))}" placeholder="frações, jogo, revisão"></div>
    </div>
    <span class="hint">Separe por vírgula. As etiquetas entram na busca.</span>
  </div>
  <div class="sheet"><h3>Arquivos e links</h3>
    ${(a.anexos||[]).map((x,i)=>`<div class="file">${ICON.clip}<span>${esc(x.nome)}</span><small>${tamanho(x.tam||0)}</small><button type="button" class="btn danger sm" data-act="tirar-anexo" data-i="${i}" aria-label="Remover ${esc(x.nome)}">Remover</button></div>`).join("")}
    <label class="btn soft" for="f-anexo" style="justify-self:start">${ICON.clip}Anexar arquivo<input id="f-anexo" type="file" multiple hidden></label>
    <span class="hint" id="up-st">PDF, slides, fotos do quadro, atividades.</span>
    <div class="field"><label for="f-links">Links (um por linha)</label><textarea id="f-links" data-b="links" data-lista="1" style="min-height:64px" placeholder="https://…">${esc(lista(a.links).join("\n"))}</textarea></div>
  </div>
  <div class="sheet"><h3>Situação</h3>
    <div class="chips wrap"><button type="button" class="chip" data-act="status" data-v="planejada" aria-pressed="${a.status==="planejada"}">Planejada</button><button type="button" class="chip" data-act="status" data-v="dada" aria-pressed="${a.status==="dada"}">Já dei essa aula</button></div>
    ${a.status==="dada"?`<div class="field"><label for="f-ref">Como foi a aula?</label><textarea id="f-ref" data-b="reflexao" placeholder="O que funcionou, o que mudar na próxima vez">${esc(a.reflexao)}</textarea></div>`:""}
  </div>
  ${erro?`<div class="err" role="alert">${esc(erro)}</div>`:""}
  <div class="savebar"><button class="btn pri full" type="submit">${ed?"Salvar alterações":"Guardar aula"}</button></div>
  ${ed?(confirmDel?`<div class="confirm">Excluir esta aula e os arquivos dela? <button type="button" class="btn danger sm" data-act="excluir-sim" data-t="aulas">Excluir</button><button type="button" class="btn sm" data-act="excluir-nao">Cancelar</button></div>`:`<button type="button" class="btn danger" data-act="excluir" style="justify-self:start">Excluir aula</button>`):""}
  </form>`;
};
TELAS.duplicar = () => {
  const a=D.aulas.find(x=>x.id===sel); if(!a) return "";
  const ts=turmasAtivas();
  return `<form class="stack" id="form" data-k="duplicar" novalidate>
  <div class="stack" style="gap:8px"><button type="button" class="back" data-act="voltar">${ICON.left}Voltar</button><h1>Usar em outra turma</h1>
  <p class="muted">Cria uma cópia de "${esc(a.titulo)}" com o planejamento, as etiquetas e os arquivos. A cópia começa como planejada e sem reflexão.</p></div>
  <div class="sheet">
    <div class="field"><label for="d-turma">Turma</label><select id="d-turma">${(()=>{ const pref=(ts.find(t=>t.id!==a.turma_id)||{}).id; return ts.map(t=>`<option value="${esc(t.id)}" ${t.id===pref?"selected":""}>${esc(t.nome)} (${t.ano_letivo})${t.id===a.turma_id?" (turma atual)":""}</option>`).join(""); })()}</select></div>
    <div class="field"><label for="d-data">Data</label><input id="d-data" type="date" value="${hoje()}"></div>
  </div>
  ${erro?`<div class="err" role="alert">${esc(erro)}</div>`:""}
  <button class="btn pri full" type="submit">Criar cópia</button></form>`;
};

/* ---- notas ---- */
function cardNota(n){
  return `<button class="note" data-act="editar-nota" data-id="${esc(n.id)}" style="--nc:var(--n-${esc(n.cor||"lilas")})">
    ${n.titulo?`<span class="nt">${esc(n.titulo)}</span>`:""}${n.texto?`<span class="nx">${esc(n.texto)}</span>`:""}
    <span class="nm">${n.fixada?`<span style="color:var(--accent-text)">${ICON.pin}</span>`:""}${ttag(n.turma_id)}<span>${n.atualizado_em?fmtCurta(n.atualizado_em.slice(0,10)):""}</span></span></button>`;
}
TELAS.notas = () => {
  const q=norm(notaFiltro.q).trim();
  const lst=D.anotacoes.filter(n=>!q||norm(`${n.titulo} ${n.texto} ${turmaDe(n.turma_id)?.nome||""}`).includes(q))

function todasQuestoesOrdenadas(){ return D.questoes.slice().sort((a,b)=>(b.criado_em||"").localeCompare(a.criado_em||"")); }
function questoesFiltradas(){
  const q = norm(qFiltro.q).trim();

    if(qFiltro.serie!=="todas" && (x.serie||"")!==qFiltro.serie) return false;

// embaralha as alternativas de forma estável (a mesma prova sai sempre igual)
function hashStr(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function ordemAlt(q,p){ const o=[0,1,2,3]; if(!p?.embaralhar) return o; const r=rng(hashStr(q.id)^(p.semente||1)); for(let i=3;i>0;i--){ const j=Math.floor(r()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; } return o; }

    <p class="pv-nome">Nome: ____________________________________________ Nº: ______</p></div>
    ${p.instrucoes?`<p class="pv-ins">${esc(p.instrucoes)}</p>`:""}

// lê questões coladas de um documento: "1) enunciado / a) ... / b) ... *"
function lerQuestoes(txt){
  const linhas = String(txt||"").replace(/\r/g,"").split("\n");
  const qs=[]; let cur=null;
  const novo=()=>{ cur={enun:[],alts:[],correta:null}; qs.push(cur); };
  const reAlt=/^\(?([a-dA-D])\s*[\)\.\-–:]\s*(.*)$/;
  const reNum=/^(?:quest[ãa]o\s*)?\d{1,3}\s*[\)\.\-–:]\s*(.*)$/i;
  const reResp=/^(?:resposta|gabarito|correta|alternativa correta)\s*[:\-–]?\s*(?:letra\s*)?\(?([a-dA-D])\)?\s*\.?$/i;
  const marcaFim=/\s*(?:\*+|\(x\)|\[x\]|✓|✔|<-+|←|\(correta\))\s*$/i, marcaIni=/^(?:\*+|\(x\)|\[x\]|✓|✔)\s*/i;
  for(const raw of linhas){
    let l=raw.trim();
    if(!l){ if(cur && cur.alts.length>=4) cur=null; continue; }
    let m;
    if(cur && (m=reResp.exec(l))){ cur.correta="abcd".indexOf(m[1].toLowerCase()); continue; }
    let estrela=false; if(cur && cur.enun.length && marcaIni.test(l) && reAlt.test(l.replace(marcaIni,""))){ estrela=true; l=l.replace(marcaIni,""); }
    if(cur && cur.enun.length && cur.alts.length<4 && (m=reAlt.exec(l)) && "abcd".indexOf(m[1].toLowerCase())===cur.alts.length){
      let t=m[2].trim(); let ok=estrela;
      if(marcaIni.test(t)){ ok=true; t=t.replace(marcaIni,""); }
      if(marcaFim.test(t)){ ok=true; t=t.replace(marcaFim,""); }
      cur.alts.push(t.trim()); if(ok) cur.correta=cur.alts.length-1; continue;
    }
    const numerada = reNum.test(l);
    if(!cur || cur.alts.length>=4 || (numerada && cur.alts.length>0)) novo();
    if(cur.alts.length){ cur.alts[cur.alts.length-1]+=" "+l; continue; }
    cur.enun.push(cur.enun.length ? l : l.replace(reNum,"$1"));
  }
  return qs.filter(q=>q.enun.join("").trim()||q.alts.length).map(q=>({enunciado:q.enun.join("\n").trim(), alternativas:q.alts, correta:q.correta}));
}
function problemaColar(q){
  if(!q.enunciado) return "Falta o enunciado.";
  if(q.alternativas.length!==4) return `Encontrei ${q.alternativas.length} alternativa(s). Cada questão precisa de 4.`;
  if(q.alternativas.some(x=>!x.trim())) return "Há alternativa vazia.";
  if(q.correta==null) return "Toque na alternativa correta.";
  return "";
}

function bip(){
  try{
    somCtx = somCtx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.22].forEach((t,i)=>{ const o=somCtx.createOscillator(), g=somCtx.createGain(); o.type="sine"; o.frequency.value=i?660:880;
      g.gain.setValueAtTime(0.0001,somCtx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.25,somCtx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,somCtx.currentTime+t+0.2);
      o.connect(g).connect(somCtx.destination); o.start(somCtx.currentTime+t); o.stop(somCtx.currentTime+t+0.22); });
  }catch(e){}
}

function inicioFim(e){
  const d=parseD(e.data);
  if(!e.hora) return null;
  const [h,mi]=e.hora.split(":").map(Number), ini=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,mi||0);
  return [ini, new Date(ini.getTime()+3600e3)];
}
const utc = d => d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
const local = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const icsTxt = s => String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
function dobra(l){ const out=[]; while(l.length>73){ out.push(l.slice(0,73)); l=" "+l.slice(73); } out.push(l); return out.join("\r\n"); }
function icsDe(evs){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Repositorio da Lulu//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Repositório da Lulu"];
  const agora=utc(new Date());
  evs.forEach(e=>{
    L.push("BEGIN:VEVENT","UID:"+(e.id||uid())+"@repositorio-da-lulu","DTSTAMP:"+agora,"SUMMARY:"+icsTxt(e.titulo));
    const f=inicioFim(e);
    if(f) L.push("DTSTART:"+utc(f[0]),"DTEND:"+utc(f[1]));
    else L.push("DTSTART;VALUE=DATE:"+e.data.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(e.data_fim||e.data,1).replace(/-/g,""));
    if(e.descricao) L.push("DESCRIPTION:"+icsTxt(e.descricao));
    if(e.alarme_min!=null){ const m=e.alarme_min; L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsTxt(e.titulo),"TRIGGER:"+(m>=0?"-":"")+"PT"+Math.abs(m)+"M","END:VALARM"); }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(dobra).join("\r\n");
}
function baixarIcs(evs,nome){

  else { a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"})); a.download=nome; }

}

      ocupado(); const t = await DB.salvar("turmas",{...draft,nome:draft.nome.trim(),ano_letivo:ano,id:sel||undefined});
      toast(sel?"Turma salva":"Turma cadastrada");
      if(voltarAula && !sel){ const v=voltarAula; voltarAula=null; v.turma_id=t.id; if(!v.disciplina) v.disciplina=t.disciplina||""; restaurar=v; if(history.state?.d>0) history.back(); else go("aula-form"); return; }
      go("turmas");
    }
    if(k==="questao"){
      const alts=draft.alternativas.map(x=>String(x||"").trim());
      if(!String(draft.enunciado||"").trim()){ erro="Escreva a pergunta."; return render(); }
      if(alts.some(x=>!x)){ erro="Preencha as quatro alternativas."; return render(); }
      if(draft.correta==null){ erro="Toque na letra da alternativa correta."; return render(); }
      ocupado();
      const {id:_x, ...resto}=draft;
      await DB.salvar("questoes",{...resto, enunciado:draft.enunciado.trim(), alternativas:alts, id:sel||undefined});
      ultimoQ={serie:draft.serie,disciplina:draft.disciplina,bimestre:draft.bimestre,dificuldade:draft.dificuldade,etiquetas:draft.etiquetas};
      if(e.submitter?.dataset.mais){
        draft={...resto, enunciado:"", alternativas:["","","",""], correta:null, explicacao:"", bncc:draft.bncc};
        toast("Questão guardada. Escreva a próxima."); render(); window.scrollTo(0,0); document.getElementById("q-enun")?.focus(); return;
      }
      toast(sel?"Questão salva":"Questão guardada"); qAba="banco"; go("questoes");
    }
    if(k==="colar"){
      const ok=(colar.itens||[]).filter(q=>!problemaColar(q)), resto=(colar.itens||[]).filter(q=>problemaColar(q));
      if(!ok.length){ erro="Nenhuma questão pronta. Ajuste as marcadas em vermelho."; return render(); }
      ocupado();
      for(const q of ok) await DB.salvar("questoes",{enunciado:q.enunciado, alternativas:q.alternativas.map(a=>a.trim()), correta:q.correta, explicacao:"",
        serie:colar.serie.trim(), disciplina:colar.disciplina.trim(), bimestre:colar.bimestre, dificuldade:"media", bncc:[], etiquetas:[]});
      ultimoQ={...ultimoQ, serie:colar.serie.trim(), disciplina:colar.disciplina.trim(), bimestre:colar.bimestre};
      if(resto.length){ colar.itens=resto; colar.texto=""; toast(`${ok.length} guardada(s). Faltam ajustar ${resto.length}.`); render(); window.scrollTo(0,0); return; }
      colar={texto:"", itens:null, serie:colar.serie, disciplina:colar.disciplina, bimestre:colar.bimestre};
      toast(`${ok.length} ${ok.length===1?"questão guardada":"questões guardadas"}`); qAba="banco"; go("questoes");
    }
    if(k==="prova"){
      if(!String(draft.titulo||"").trim()){ erro="Dê um título para a prova."; return render(); }
      if(!draft.questao_ids.length){ erro="Escolha pelo menos uma questão."; return render(); }
      ocupado();
      const s=await DB.salvar("provas",{...draft, titulo:draft.titulo.trim(), id:sel||undefined});
      draft.id=s.id; sel=s.id; try{ history.replaceState({...(history.state||{}), v:"prova-form", id:s.id},""); }catch(x){}
      toast("Prova salva"); render();
    }
    if(k==="calendario"){
      const preenchidos=draft.lista.every(x=>x[0]&&x[1]);
      if(draft.lista.some(x=>x[0]&&x[1]&&x[0]>x[1])){ erro="Em algum bimestre o fim está antes do início."; return render(); }
      ocupado();
      const bims={...(D.perfil?.bimestres||{})};
      if(preenchidos) bims[draft.ano]=draft.lista;
      await DB.perfil({nome:draft.nome.trim(), escola:draft.escola.trim(), bimestres:bims});
      toast("Salvo"); go("mais");
    }
  }catch(x){ if(btn){ btn.disabled=false; btn.textContent=txt; } falha(x); }
});

/* ---------- leitura de print (OCR no aparelho) ---------- */
let tess=null;
function carregaTess(){ return tess||(tess=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload=()=>res(window.Tesseract); s.onerror=()=>{tess=null;rej();}; document.head.append(s); })); }
async function lerPrint(file){
  aviso.erro=""; aviso.lendo="Preparando a leitura…"; render();
  try{
    const T=await carregaTess();
    const r=await T.recognize(file,"por",{logger:m=>{ if(m.status==="recognizing text"){ aviso.lendo=`Lendo o print… ${Math.round(m.progress*100)}%`; const s=document.getElementById("ocr-st"); if(s) s.textContent=aviso.lendo; } }});
    const txt=(r.data.text||"").replace(/\n{3,}/g,"\n\n").trim();
    aviso.texto = aviso.texto.trim() ? aviso.texto.trim()+"\n\n"+txt : txt; aviso.lendo="";
    if(!txt) aviso.erro="Não encontrei texto nessa imagem. Tente um print mais nítido.";
  }catch(e){ aviso.lendo=""; aviso.erro="Não foi possível ler o print agora. Verifique a internet ou cole o texto."; }
  render();
}

/* ---------- conta ---------- */
async function entrar(){
  const email=document.getElementById("l-email").value.trim(), senha=document.getElementById("l-senha").value;
  if(!email||!senha){ auth.msg="Informe e-mail e senha."; auth.ok=""; render(); document.getElementById("l-email").value=email; return; }
  const b=document.querySelector("#login [type=submit]"); b.disabled=true; b.textContent="Aguarde…";
  if(auth.modo==="criar"){
    if(senha.length<6){ auth.msg="A senha precisa de pelo menos 6 caracteres."; render(); document.getElementById("l-email").value=email; return; }
    const {data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:location.origin+location.pathname}});
    if(error){ auth.msg=/registered|already/i.test(error.message)?"Esse e-mail já tem conta. Toque em Entrar.":"Não foi possível criar a conta. Confira o e-mail e tente de novo."; auth.ok=""; render(); document.getElementById("l-email").value=email; return; }
    if(!data.session){ auth={modo:"entrar",msg:"",ok:"Conta criada. Abra o e-mail de confirmação que enviamos e depois entre aqui."}; render(); document.getElementById("l-email").value=email; }
    return;
  }
  const {error}=await sb.auth.signInWithPassword({email,password:senha});
  if(error){ auth.msg=/confirm/i.test(error.message)?"Confirme o e-mail antes de entrar. O link está na sua caixa de entrada.":"E-mail ou senha incorretos."; auth.ok=""; render(); document.getElementById("l-email").value=email; }
}
async function novaSenha(){
  const v=document.getElementById("ns").value;
  if(v.length<6){ auth.msg="A senha precisa de pelo menos 6 caracteres."; render(); return; }
  const {error}=await sb.auth.updateUser({password:v});
  if(error){ auth.msg="Não foi possível trocar a senha. Peça um novo link."; render(); return; }
  recuperando=false; auth={modo:"entrar",msg:"",ok:""}; toast("Senha alterada"); go("inicio");
}

/* ---------- carregamento ---------- */
async function carregar(){
  try{
    sync("", "Sincronizando"); await DB.carregar(); online=true; cache();
    sync("on", demo?"Neste aparelho":"Salvo na nuvem");
  }catch(e){
    console.error(e); online=false;
    const c = session && ls.get("lulu-cache-"+session.user.id);
    if(c) Object.assign(D,c);
    sync("off", c?"Sem internet, mostrando a última cópia":"Sem conexão");
  }
  if(!/^(aula-form|nota-form|evento-form|turma-form|calendario|duplicar|questao-form|questoes-colar|prova-form|quiz)$/.test(view) && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")) render();
}

function lerCompartilhado(){
  // Recebido pelo botão Compartilhar do celular (Web Share Target): ?title=…&text=…&url=…
  try{
    const p=new URLSearchParams(location.search);
    const partes=[p.get("title"),p.get("text"),p.get("url")].filter(Boolean);
    if(!partes.length) return false;
    const url=p.get("url")||"", tudo=partes.join("\n");
    aviso.texto=[...new Set(partes)].join("\n"); aviso.origem=/instagram\.com/i.test(tudo)?"instagram":"whatsapp";
    history.replaceState(null,"",location.pathname);
    return true;
  }catch(e){ return false; }
}

(async()=>{
  const compartilhou = lerCompartilhado();
  const cfg = window.LULU_CONFIG || {};
  const temNuvem = cfg.SUPABASE_URL && !/COLE_AQUI/.test(cfg.SUPABASE_URL) && window.supabase;
  if(!temNuvem){
    demo=true; DB=Local; await carregar();
    view = compartilhou ? "avisos" : "inicio";
    try{ history.replaceState({v:view,d:0},""); }catch(e){}
    render(); return;
  }
  DB=Nuvem; sb=supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_KEY);
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==="PASSWORD_RECOVERY"){ recuperando=true; }
    const tinha=!!session; session=s;
    if(session && !tinha){
      const c=ls.get("lulu-cache-"+session.user.id); if(c) Object.assign(D,c);
      view = compartilhou ? "avisos" : "inicio";
      try{ history.replaceState({v:view,d:0},""); }catch(e){}
      render(); setTimeout(carregar,0);
    }
    if(!session){ TABELAS.forEach(t=>D[t]=[]); D.perfil=null; document.getElementById("sync").hidden=true; render(); }
    if(recuperando) render();
  });
  const {data}=await sb.auth.getSession(); if(!data.session) render();
  window.addEventListener("focus",()=>{ if(session) carregar(); });
  window.addEventListener("online",()=>{ if(session) carregar(); });
})();

if("serviceWorker" in navigator && location.protocol==="https:" && !/claude|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
